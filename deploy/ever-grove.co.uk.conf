# ----------------------------------------------------------------------
# EverGrove - Nginx Server Configuration (PHP 8.4-FPM + SSL Let's Encrypt)
# Path on VPS: /etc/nginx/sites-available/ever-grove.co.uk
# Symlink: ln -s /etc/nginx/sites-available/ever-grove.co.uk /etc/nginx/sites-enabled/
# ----------------------------------------------------------------------

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name ever-grove.co.uk www.ever-grove.co.uk;

    # Let's Encrypt ACME Challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/evergrove/public;
    }

    location / {
        return 301 https://ever-grove.co.uk$request_uri;
    }
}

# 2. HTTPS www -> non-www redirect (Canonical URL)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ever-grove.co.uk;

    ssl_certificate /etc/letsencrypt/live/ever-grove.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ever-grove.co.uk/privkey.pem;

    return 301 https://ever-grove.co.uk$request_uri;
}

# 3. Main Application HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ever-grove.co.uk;

    root /var/www/evergrove/public;
    index index.php index.html;

    # SSL Certificates (Certbot)
    ssl_certificate /etc/letsencrypt/live/ever-grove.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ever-grove.co.uk/privkey.pem;

    # SSL Security & Protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    charset utf-8;
    client_max_body_size 64M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }
    
    location = /robots.txt { 
        access_log off; 
        log_not_found off; 
    }

    # Static Assets Caching (Vite built files with immutable hashes)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # PHP-FPM 8.4 Handler
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 120s;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    access_log /var/log/nginx/evergrove_access.log;
    error_log /var/log/nginx/evergrove_error.log error;
}
